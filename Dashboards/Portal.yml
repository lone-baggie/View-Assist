type: vertical-stack
cards:
  - type: custom:button-card
    color_type: blank-card
    styles:
      card:
        - height: 60px
  - square: false
    type: grid
    columns: 3
    cards:
      - type: custom:button-card
        template: variable_template
        show_name: false
        show_state: false
        show_icon: false
        aspect_ratio: 4/3
        tap_action:
          action: url
          url_path: app://com.android.settings
        hold_action:
          action: navigate
          navigation_path: /view-assist/screen-saver
        extra_styles: |
          ha-card:active {
            background-color: #FFFF00 !important;
            transform: scale(0.95);
            transition: background-color 0s, transform 0.05s !important;
          }
        styles:
          card:
            - padding: 12px 8px
            - background-color: '#0288D1'
            - transition: >-
                background-color 6s cubic-bezier(0, 1, 0.5, 1), transform 0.3s
                ease
            - box-shadow: none
            - border-radius: 10px
            - overflow: hidden
            - border: |-
                [[[
                  return (entity && entity.state === 'on') 
                    ? '3px solid var(--green-color, #4CAF50)' 
                    : 'none';
                ]]]
          grid:
            - grid-template-areas: '"svg_icon" "app_name"'
            - grid-template-rows: 1fr auto
            - justify-items: center
            - align-items: center
            - height: 100%
          custom_fields:
            svg_icon:
              - display: flex
              - justify-content: center
              - align-items: center
              - width: 100%
              - height: 100%
            app_name:
              - font-size: 1.8rem
              - font-weight: bold
              - color: '#FFFFFF'
              - text-align: center
              - padding-bottom: 6px
        custom_fields:
          svg_icon: >-
            <ha-icon icon="mdi:cog" style="width: 5.5rem; height: 5.5rem;
            --mdc-icon-size: 5.5rem; color: #FFFFFF;"></ha-icon>
          app_name: Settings
