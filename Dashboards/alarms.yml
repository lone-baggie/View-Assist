type: custom:button-card
entity: sensor.list_alarms
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
styles:
  card:
    - padding: 28px
    - background-color: var(--card-background-color)
    - border-radius: 16px
  grid:
    - grid-template-areas: '"list_container"'
    - grid-template-columns: 1fr
    - justify-items: start
    - align-items: start
  custom_fields:
    list_container:
      - width: 100%
      - text-align: left
      - justify-self: start
custom_fields:
  list_container: |
    [[[
      return (() => {
        // Fetch raw alarms array and current state count safely from HA entity
        const rawAlarms = entity.attributes.alarms;
        const alarmCount = parseInt(entity.state, 10) || 0;
        
        // Dynamic header title
        const alarmLabel = alarmCount === 1 ? 'Alarm' : 'Alarms';
        let outputHtml = '<div style="font-size: 3.6rem; font-weight: 900; color: var(--primary-text-color); margin-bottom: 24px; text-align: left;">';
        outputHtml += '⏰ Active Alarms (' + alarmCount + ' ' + alarmLabel + ')';
        outputHtml += '</div>';
        
        // Handle empty alarm list gracefully
        if (!rawAlarms || !Array.isArray(rawAlarms) || rawAlarms.length === 0) {
          outputHtml += '<div style="font-size: 2.8rem; font-weight: bold; color: var(--secondary-text-color); text-align: left;">🎉 No active alarms set</div>';
          return outputHtml;
        }

        // Get current weekday name dynamically (e.g., "Thursday")
        const currentDay = new Date().toLocaleDateString('en-US', { weekday: 'long' });

        // Clone and sort the array: Time -> Reoccurring -> Persistant
        const alarms = [...rawAlarms].sort((a, b) => {
          // 1. Sort by Time (HH:MM string comparison)
          const timeA = a.time || '00:00';
          const timeB = b.time || '00:00';
          const timeCompare = timeA.localeCompare(timeB);
          if (timeCompare !== 0) return timeCompare;

          // 2. Sort by Reoccurring status
          const recurA = a.Reoccurring || '';
          const recurB = b.Reoccurring || '';
          const recurCompare = recurA.localeCompare(recurB);
          if (recurCompare !== 0) return recurCompare;

          // 3. Sort by Persistant flag (true values first)
          const persistA = a.persistant ? 1 : 0;
          const persistB = b.persistant ? 1 : 0;
          return persistB - persistA;
        });

        // CSS Grid setup: Column 1 gets 55% width, Column 2 gets 45% width (left-aligned)
        outputHtml += '<div style="display: grid; grid-template-columns: 55% 45%; row-gap: 16px; align-items: center; width: 100%;">';

        // Map over sorted alarm objects and render elements into two grid cells
        alarms.forEach((alarm) => {
          // Extract values safely with fallbacks
          const rawName = alarm['Friendly name'] || alarm.alarm_id || '';
          const name = rawName ? 'Alarm ' + rawName : 'Alarm';
          const time = alarm.time || '00:00';
          
          // Process recurring status: convert 'once' to 'Once <CurrentDay>'
          let reoccurring = alarm.Reoccurring || 'once';
          if (reoccurring.toLowerCase().trim() === 'once') {
            reoccurring = 'Once ' + currentDay;
          }

          const persistent = alarm.persistant ? '📌 ' : '';

          // COLUMN 1: Time + Friendly Name (Safe truncation for long names)
          outputHtml += '<div style="display: flex; align-items: center; gap: 16px; font-size: 2.6rem; line-height: 1.2; min-width: 0; overflow: hidden; text-align: left;">';
          outputHtml += '  <span style="font-weight: 800; color: var(--primary-text-color); flex-shrink: 0;">' + time + '</span>';
          outputHtml += '  <span style="font-weight: 600; color: var(--secondary-text-color); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + name + '</span>';
          outputHtml += '</div>';

          // COLUMN 2: Left-aligned status starting at the 55% grid mark
          outputHtml += '<div style="display: flex; align-items: center; gap: 12px; font-size: 2.2rem; font-weight: 500; color: var(--secondary-text-color); text-transform: capitalize; white-space: nowrap; justify-content: flex-start; text-align: left;">';
          outputHtml += '  <span>🔁 ' + reoccurring + '</span>';
          if (persistent) {
            outputHtml += '  <span style="font-size: 2.0rem;">' + persistent + '</span>';
          }
          outputHtml += '</div>';
        });

        outputHtml += '</div>';

        return outputHtml;
      })();
    ]]]
