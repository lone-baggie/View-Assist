        template:
          - variable_template
          - responsive_base
          - body_template
        styles:
          grid:
            - grid-template-areas: |
                "title status"
                "time time"
                "date date"
            - grid-template-rows: |-
                [[[
                  if (window.viewAssistResponsive && window.viewAssistResponsive.orientation === "portrait") {
                    return "15vh 35vh 15vh";
                  } else {
                    return "15vh 50vh 15vh";
                  }
                ]]]
