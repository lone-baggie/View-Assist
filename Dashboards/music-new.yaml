type: custom:button-card
show_name: false
show_icon: false
show_state: false
triggers_update: all
variables:
  var_musicplayer_device: |-
    [[[
      var assistbid = localStorage.getItem("view_assist_sensor");
      var musicdevice = hass.states[assistbid].attributes.musicplayer_device;
      return `${musicdevice}`
    ]]] 
custom_fields:
  background: |
    [[[
      const player = hass.states[variables.var_musicplayer_device];
      const art = player?.attributes?.entity_picture_local || player?.attributes?.entity_picture || '';
      
      /* Fixed: Removed the dominant white gradient overlay. 
         Uses your native working <img> filter approach with increased saturation 
         and scale to extract vibrant background colors directly from the art. */
      return art ? `
        <div style="position:absolute; top:0; left:0; width:100vw; height:85vh; overflow:hidden; z-index:0; background-color:#111;">
          <img src="${art}" style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; filter:blur(60px) saturate(2.2) brightness(0.65); transform:scale(1.3);" />
        </div>
      ` : '<div style="position:absolute; top:0; left:0; width:100vw; height:85vh; background:#222; z-index:0;"></div>';
    ]]]
  main_info: |
    [[[
      const player = hass.states[variables.var_musicplayer_device];
      if (!player) return `<div style="color:white;padding:40px;font-size:20px;font-family:sans-serif;z-index:1;position:relative;">Player not found</div>`;

      const title = player.attributes.media_title || 'Nothing Playing';
      const artist = player.attributes.media_artist || player.attributes.media_album_artist || 'Unknown Artist';
      const album = player.attributes.media_album_name || artist;
      const art = player.attributes.entity_picture_local || player.attributes.entity_picture || '';

      /* Fixed: Flipped text color to white to ensure high contrast against the colored artwork backdrop. */
      return `
        <div style="position:relative;z-index:1;display:flex;flex-direction:row;align-items:center;justify-content:flex-start;width:100%;height:100%;color:white;padding:0 6vw;box-sizing:border-box;gap:5vw;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
          ${art ? `<img src="${art}" style="width:50vh;height:50vh;max-width:35vw;max-height:35vw;object-fit:cover;border-radius:12px;border: 1.5px solid rgba(255,255,255,0.25);box-shadow:0 15px 40px rgba(0,0,0,0.5);flex-shrink:0;" />` : `<div style="width:50vh;height:50vh;max-width:35vw;max-height:35vw;border-radius:12px;border: 1.5px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;"><ha-icon icon="mdi:music" style="--mdc-icon-size: 60px; opacity: 0.4; color: white;"></ha-icon></div>`}
          
          <div style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start;width:100%;max-width:48vw;text-align:left;">
            <div style="font-size:2.8vh;opacity:0.65;margin-bottom:0.8vh;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;">${album}</div>
            <div style="font-size:9.5vh;font-weight:700;line-height:1.1;margin-bottom:1.2vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;letter-spacing:-0.03em;text-shadow: 0 4px 12px rgba(0,0,0,0.25);">${title}</div>
            <div style="font-size:3.5vh;opacity:0.9;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%;">${artist}</div>
          </div>
        </div>
      `;
    ]]]
  progress: |
    [[[
      const player = hass.states[variables.var_musicplayer_device];
      if (!player || player.state === 'unavailable') return '';
      
      const position = parseFloat(player.attributes.media_position || 0);
      const duration = parseFloat(player.attributes.media_duration || 0);
      const state = player.state;
      
      if (duration <= 0) return '';

      // Calculate the exact real-time playback position
      let currentPos = position;
      if (state === 'playing' && player.attributes.media_position_updated_at) {
        const updatedAt = new Date(player.attributes.media_position_updated_at).getTime() / 1000;
        currentPos += (Date.now() / 1000 - updatedAt);
      }
      
      // Express progress as a decimal factor between 0.0 and 1.0 for scaleX
      const startRatio = Math.min(1, Math.max(0, currentPos / duration));
      const remainingTime = duration - currentPos;

      // Generate a unique animation ID to prevent CSS collision during track changes
      const animId = 'anim_' + variables.var_musicplayer_device.replace(/[^a-zA-Z0-9]/g, '');

      return `
        <div style="width:100%; height:100%; background: rgba(255,255,255,0.1); position:relative; z-index:2; overflow:hidden;">
          <style>
            @keyframes ${animId} {
              from { transform: scaleX(${startRatio}); }
              to { transform: scaleX(1); }
            }
          </style>
          <div style="
            width: 100%;
            height: 100%; 
            background: #1db954; 
            transform-origin: left center;
            transform: scaleX(${startRatio});
            ${state === 'playing' && remainingTime > 0 ? `animation: ${animId} ${remainingTime}s linear forwards;` : ''}
            will-change: transform;
          "></div>
        </div>
      `;
    ]]]
  down:
    card:
      type: custom:button-card
      show_name: false
      icon: mdi:menu-down
      styles:
        card:
          - background: transparent
          - border: none
          - box-shadow: none
        icon:
          - color: white
          - width: 55px
          - height: 55px
  shuffle:
    card:
      type: custom:button-card
      entity: '[[[ return variables.var_musicplayer_device ]]]'
      show_name: false
      icon: mdi:shuffle-variant
      styles:
        card:
          - background: transparent
          - border: none
          - box-shadow: none
        icon:
          - color: >-
              [[[ return entity?.attributes?.shuffle ? '#1db954' :
              'rgba(255,255,255,0.65)' ]]]
          - width: 38px
          - height: 38px
      tap_action:
        action: call-service
        service: media_player.shuffle_set
        service_data:
          entity_id: '[[[ return variables.var_musicplayer_device ]]]'
          shuffle: '[[[ return !entity?.attributes?.shuffle ]]]'
  prev:
    card:
      type: custom:button-card
      show_name: false
      icon: mdi:skip-previous
      styles:
        card:
          - background: transparent
          - border: none
          - box-shadow: none
        icon:
          - color: white
          - width: 48px
          - height: 48px
      tap_action:
        action: call-service
        service: media_player.media_previous_track
        service_data:
          entity_id: '[[[ return variables.var_musicplayer_device ]]]'
  play:
    card:
      type: custom:button-card
      entity: '[[[ return variables.var_musicplayer_device ]]]'
      show_name: false
      show_state: false
      icon: mdi:play
      state:
        - value: playing
          icon: mdi:pause
      styles:
        card:
          - background: transparent
          - border: none
          - box-shadow: none
        icon:
          - color: white
          - width: 64px
          - height: 64px
      tap_action:
        action: call-service
        service: media_player.media_play_pause
        service_data:
          entity_id: '[[[ return variables.var_musicplayer_device ]]]'
  next:
    card:
      type: custom:button-card
      show_name: false
      icon: mdi:skip-next
      styles:
        card:
          - background: transparent
          - border: none
          - box-shadow: none
        icon:
          - color: white
          - width: 48px
          - height: 48px
      tap_action:
        action: call-service
        service: media_player.media_next_track
        service_data:
          entity_id: '[[[ return variables.var_musicplayer_device ]]]'
  repeat:
    card:
      type: custom:button-card
      entity: '[[[ return variables.var_musicplayer_device ]]]'
      show_name: false
      icon: mdi:repeat
      styles:
        card:
          - background: transparent
          - border: none
          - box-shadow: none
        icon:
          - color: >-
              [[[ return (entity?.attributes?.repeat &&
              entity?.attributes?.repeat !== 'off') ? '#1db954' :
              'rgba(255,255,255,0.65)' ]]]
          - width: 38px
          - height: 38px
      tap_action:
        action: call-service
        service: media_player.repeat_set
        service_data:
          entity_id: '[[[ return variables.var_musicplayer_device ]]]'
          repeat: >-
            [[[ return (entity?.attributes?.repeat === 'off' ||
            !entity?.attributes?.repeat) ? 'all' : 'off' ]]]
  empty: |
    [[[ return `` ]]]
styles:
  card:
    - background-color: '#0a0a0a'
    - height: 100vh
    - width: 100vw
    - padding: 0
    - margin: 0
    - overflow: hidden
    - position: relative
  grid:
    - grid-template-areas: |
        "main_info main_info main_info main_info main_info main_info main_info"
        "progress progress progress progress progress progress progress"
        "down shuffle prev play next repeat empty"
    - grid-template-rows: 85vh 6px 14vh
    - grid-template-columns: 15vw 14vw 14vw 14vw 14vw 14vw 11vw
  custom_fields:
    background:
      - position: absolute
      - top: 0
      - left: 0
      - width: 100%
      - height: 100%
      - z-index: 0
      - pointer-events: none
    main_info:
      - width: 100%
      - height: 100%
      - z-index: 1
      - pointer-events: none
    progress:
      - width: 100%
      - height: 100%
      - z-index: 2
      - pointer-events: none
    down:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: 3
    shuffle:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: 3
    prev:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: 3
    play:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: 3
    next:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: 3
    repeat:
      - width: 100%
      - height: 100%
      - display: flex
      - align-items: center
      - justify-content: center
      - z-index: 3
    empty:
      - width: 100%
      - height: 100%
