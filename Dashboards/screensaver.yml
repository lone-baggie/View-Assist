type: custom:button-card
styles:
  card:
    - height: 100vh
    - width: 100vw
    - margin: 0px
    - padding: 0px
    - border-radius: 0px
    - background-color: '#000000'
  custom_fields:
    webpage:
      - position: absolute
      - top: 0
      - left: 0
      - width: 100%
      - height: 100%
      - pointer-events: none
custom_fields:
  webpage: |
    <iframe 
      src="/local/bing.html" 
      style="width: 100%; height: 100%; border: none; pointer-events: none;" 
      scrolling="no">
    </iframe>
tap_action:
  action: navigate
  navigation_path: /view-assist/radio
hold_action:
  action: navigate
  navigation_path: /view-assist/portal
