type: custom:button-card
entity: sensor.shopping_list_scene
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
styles:
  card:
    - padding: 28px
    - background-color: var(--card-background-color)
    - border-radius: 16px
  grid:
    - grid-template-areas: '"list_container"'
    - grid-template-columns: 1fr
    - justify-items: start
    - align-items: start
  custom_fields:
    list_container:
      - width: 100%
      - text-align: left
      - justify-self: start
custom_fields:
  list_container: |
    [[[
      return (() => {
        // Fetch raw attribute and current state (item count) safely from the HA entity
        const rawList = entity.attributes.text_content;
        const itemCount = entity.state || 0;
        
        // Build the dynamic header title with proper singular/plural grammar
        const itemLabel = itemCount == 1 ? 'item' : 'items';
        let outputHtml = '<div style="font-size: 3.6rem; font-weight: 900; color: var(--primary-text-color); margin-bottom: 28px; text-align: left;">';
        outputHtml += '🛒 Shopping List (' + itemCount + ' ' + itemLabel + ')';
        outputHtml += '</div>';
        
        // Handle empty list state gracefully
        if (!rawList || rawList.trim() === '') {
          outputHtml += '<div style="font-size: 2.8rem; font-weight: bold; color: var(--secondary-text-color); text-align: left;">🎉 Your shopping list is empty!</div>';
          return outputHtml;
        }

        // Parse comma-separated string, trim whitespace, drop empty elements, and apply natural locale A-Z sorting
        const items = rawList
          .split(',')
          .map(i => i.trim())
          .filter(i => i.length > 0)
          .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true }));

        // Divide sorted array length evenly into 3 columns
        const perCol = Math.ceil(items.length / 3);
        const col1 = items.slice(0, perCol);
        const col2 = items.slice(perCol, perCol * 2);
        const col3 = items.slice(perCol * 2);

        // Helper function: Encapsulates each column with overflow/word-break protections
        const renderColumn = (colItems) => {
          let colHtml = '<div style="flex: 1 1 0px; min-width: 0; overflow: hidden;">';
          colItems.forEach((item) => {
            colHtml += '<div style="font-size: 2.8rem; font-weight: 700; line-height: 1.3; margin-bottom: 18px; color: var(--primary-text-color); text-align: left; overflow-wrap: anywhere; word-break: break-word; hyphens: auto;">';
            colHtml += item;
            colHtml += '</div>';
          });
          colHtml += '</div>';
          return colHtml;
        };

        // Render the 3-column Flexbox layout structure
        outputHtml += '<div style="display: flex; gap: 24px; width: 100%; align-items: flex-start;">';
        outputHtml += renderColumn(col1);
        outputHtml += renderColumn(col2);
        outputHtml += renderColumn(col3);
        outputHtml += '</div>';

        return outputHtml;
      })();
    ]]]
