blueprint:
  name: "VA - Music Display Sync"
  description: "Monitors Vaca media players and automatically routes navigation commands to the matching View Assist display using attribute grepping when music starts or stops."
  author: Lonebaggie
  homeassistant:
    min_version: 2024.6.0
  domain: automation
  input:
    media_player_entities:
      name: Media Players
      description: Select the media players to monitor for active playback.
      selector:
        entity:
          integration: music_assistant
          domain: media_player
          multiple: true
    music_path:
      name: Music View Path
      description: The View Assist path for the active music screen.
      default: "/view-assist/music"
      selector:
        text: {}
    stop_path:
      name: Stop View Path
      description: The View Assist path to navigate to when music stops playing (e.g., home view).
      default: "/view-assist/home"
      selector:
        text: {}

mode: queued
max: 10

trigger:
  - trigger: media_player.started_playing
    target:
      entity_id: !input media_player_entities
    options:
      behavior: each
      for: "00:00:03"
    id: playing

  - trigger: state
    entity_id: !input media_player_entities
    from: "playing"
    to:
      - "idle"
      - "paused"
      - "off"
    id: stopped

conditions: []

action:
  - variables:
      # Capture blueprint inputs
      music_path_val: !input music_path
      stop_path_val: !input stop_path
      triggered_player: "{{ trigger.entity_id }}"
      device_id: "{{device_id(triggered_player)}}"
      matching_display: "{{view_assist_entity(device_id)}}"
      

      # Determine target view path based on trigger ID
      target_path: >-
        {% if trigger.id == 'playing' %}
          {{ music_path_val }}
        {% else %}
          {{ stop_path_val }}
        {% endif %}

  # Dispatch navigation command only if a display was successfully matched
  - if:
      - condition: template
        value_template: "{{ matching_display != '' }}"
    then:
      - action: view_assist.navigate
        data:
          device: "{{ matching_display }}"
          path: "{{ target_path }}"
          revert_timeout: 99999999