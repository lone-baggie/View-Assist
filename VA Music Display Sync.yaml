blueprint:
  name: "VA - Music Display Sync"
  description: "Monitors View Assist media players and automatically routes navigation commands to the matching View Assist display when music starts or stops."
  author: Lonebaggie
  homeassistant:
    min_version: 2024.6.0
  domain: automation
  input:
    media_player_entities:
      name: Media Players
      description: Select the media players to monitor for active playback.
      selector:
        entity:
          integration: music_assistant
          domain: media_player
          multiple: true
    music_path:
      name: Music View Path
      description: The View Assist path for the active music screen.
      default: "/view-assist/music"
      selector:
        text: {}
    stop_path:
      name: Stop View Path
      description: The View Assist path to navigate to when music stops playing (e.g., home view).
      default: "/view-assist/home"
      selector:
        text: {}

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input media_player_entities
    to: "playing"
    for:
      seconds: 3
    id: playing

  - trigger: state
    entity_id: !input media_player_entities
    from: "playing"
    to:
      - "idle"
      - "paused"
      - "off"
    id: stopped

conditions: []

actions:
  - variables:
      music_path: !input music_path
      stop_path: !input stop_path
      triggered_player: "{{ trigger.entity_id }}"
      matching_display: "{{view_assist_entity(triggered_player)}}"

  # Only proceed if we actually matched a display device
  - condition: template
    value_template: "{{ matching_display != '' }}"

  - choose:
      - conditions:
          - condition: trigger
            id: "playing"
        sequence:
          - action: view_assist.set_state
            target:
              entity_id: "{{ matching_display }}"
            data:
              mode: hold
          - action: view_assist.navigate
            data:
              device: "{{ matching_display }}"
              path: "{{ music_path }}"

      - conditions:
          - condition: trigger
            id: "stopped"
        sequence:
          - action: view_assist.set_state
            target:
              entity_id: "{{ matching_display }}"
            data:
              mode: normal
          - action: view_assist.navigate
            data:
              device: "{{ matching_display }}"
              path: "{{ stop_path }}"